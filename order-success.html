<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment successful | Corten Living</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/images/logo.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        corten: {400:'#e57a48',500:'#d56f3d',600:'#b7410e',700:'#9c340b',800:'#7e2d0a',900:'#67260c',950:'#381106'},
        metal: {850:'#141414',900:'#0a0a0a',950:'#050505'}
      },
      fontFamily: {sans:['Inter','system-ui','sans-serif'], display:['Oswald','Inter','sans-serif']}
    }
  }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="font-sans text-gray-200 antialiased metal-texture min-h-screen flex flex-col">
<nav class="border-b border-corten-900/40 bg-metal-950">
  <div class="max-w-3xl mx-auto px-4 h-16 flex items-center gap-3">
    <img src="/images/logo.svg" alt="" class="w-8 h-8">
    <span class="font-display text-lg text-white tracking-wide">CORTEN LIVING</span>
  </div>
</nav>
<main class="flex-1 flex items-center justify-center px-4 py-16">
  <div class="max-w-lg w-full bg-metal-850 border border-corten-700/40 rounded-sm p-8 text-center">
    <p class="text-corten-400 font-display text-2xl sm:text-3xl mb-2">Payment successful</p>
    <p id="order-ref" class="text-white font-medium mb-4"></p>
    <p class="text-sm text-gray-400 leading-relaxed">
      Thanks — Stripe has confirmed your payment.
    </p>
    <p id="email-status" class="mt-4 text-sm text-gray-500">Sending confirmation…</p>
    <p id="receipt-wrap" class="hidden mt-5">
      <a id="receipt-link" href="#" target="_blank" rel="noopener"
        class="inline-block px-5 py-2.5 corten-gradient text-white text-sm font-semibold rounded-sm">
        View Stripe receipt
      </a>
      <span class="block text-xs text-gray-500 mt-2">Open this if the email hasn’t arrived yet.</span>
    </p>
    <p class="text-xs text-gray-600 mt-4">Questions? 027 383 8178 · cortenliving@gmail.com</p>
    <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
      <a href="/house-numbers" class="px-5 py-2.5 border border-gray-600 text-gray-300 text-sm font-semibold rounded-sm hover:border-corten-500">Order more numbers</a>
      <a href="/" class="px-5 py-2.5 border border-gray-600 text-gray-300 text-sm font-semibold rounded-sm hover:border-corten-500">Home</a>
    </div>
  </div>
</main>
<script>
try { localStorage.removeItem('cortenCart'); } catch (e) {}

const params = new URLSearchParams(location.search);
const order = params.get('order');
const session = params.get('session_id');
const el = document.getElementById('order-ref');
const statusEl = document.getElementById('email-status');
const receiptWrap = document.getElementById('receipt-wrap');
const receiptLink = document.getElementById('receipt-link');

if (order) el.textContent = 'Order ' + order;
else if (session) el.textContent = 'Checkout confirmed';
else el.textContent = 'Your order is confirmed';

function showReceipt(url) {
  if (!url) return;
  receiptLink.href = url;
  receiptWrap.classList.remove('hidden');
}

(async function notifyPaidOrder() {
  if (!session) {
    statusEl.textContent = 'No session id — contact us if you need a receipt.';
    statusEl.className = 'mt-4 text-sm text-amber-400';
    return;
  }

  let lastErr = '';
  for (let attempt = 0; attempt < 4; attempt++) {
    if (attempt > 0) await new Promise((r) => setTimeout(r, 1500 * attempt));
    try {
      const res = await fetch('/api/confirm-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ sessionId: session }),
      });
      const data = await res.json().catch(() => ({}));

      if (data.receiptUrl) showReceipt(data.receiptUrl);

      if (res.ok) {
        const bits = [];
        if (data.shopNotified) bits.push('We have been notified of your order');
        if (data.stripeEmail?.invoiceSent) bits.push('Stripe invoice emailed');
        if (data.customerEmailed) bits.push('Confirmation emailed to ' + (data.customer || 'you'));
        else if (data.customer) {
          bits.push('Your Stripe receipt should go to ' + data.customer + ' (check spam)');
          bits.push('Or use View Stripe receipt below');
        }
        statusEl.textContent = bits.join('. ') || 'Order recorded.';
        statusEl.className = (data.shopNotified || data.receiptUrl)
          ? 'mt-4 text-sm text-green-400'
          : 'mt-4 text-sm text-amber-300';
        return;
      }
      lastErr = data.error || data.warning || ('HTTP ' + res.status);
    } catch (e) {
      lastErr = e.message || 'Network error';
    }
  }

  statusEl.innerHTML =
    'Could not finish automatic emails. Email us at ' +
    '<a class="text-corten-400 underline" href="mailto:cortenliving@gmail.com">cortenliving@gmail.com</a> ' +
    'with your order number.' +
    (lastErr ? '<span class="block mt-1 text-xs text-gray-600">' + lastErr + '</span>' : '');
  statusEl.className = 'mt-4 text-sm text-amber-400';
})();
</script>
</body>
</html>
